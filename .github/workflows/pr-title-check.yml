# Enforce Conventional Commits on the PR *title*, which squash-merge turns
# into the master commit subject release-please parses. Working commits on the
# branch stay prose (see CLAUDE.md); the title is the one place the convention
# is required, so this check is what keeps the changelog honest -- and, on this
# repository, what keeps the version honest, since the type in the title is the
# only thing that decides whether a merge cuts a tag.
#
# The types below are release-please's, not this action's. The action defaults
# to the `conventional-commit-types` (Angular) list, which is a near-miss: it
# omits `feature`, a type release-please treats as a synonym for `feat` in both
# DefaultVersioningStrategy (minor bump) and the changelog preset (visible,
# under "Features"). The list here is instead the default `types` of
# `conventional-changelog-conventionalcommits`, which is what release-please
# writes notes with while this repository declares no `changelog-sections` --
# the same list conventional-types.json holds and src/conventional.ts falls
# back to. Nothing keeps the two equal, so keep them equal by hand. Both drifts
# are quiet: too strict red-lights a title that would have released correctly,
# too loose lets a commit onto master that the changelog silently omits.
#
# Rejecting anything outside that list is the point, and the two ways a
# rejected title fails are both silent. `wip:` and `hotfix:` match no entry in
# the preset, so release-please parses the commit and then drops it from the
# changelog, releasing nothing. A *miscased* type is worse, because it
# half-works: the changelog lowercases the type before matching it
# (`findTypeEntry`) while `DefaultVersioningStrategy` compares
# `commit.type === 'feat'` literally, so `Feat:` renders a correct-looking
# "Features" entry and bumps a **patch** -- a feature shipped as a patch
# release, with no error anywhere.
#
# This is a required check: the master ruleset requires `validate-title` and
# nothing else, in infra/github/main.tf. The cost lands on the release pull
# request, which the release job opens with the default token. GitHub holds
# the workflow runs on a bot's pull request until someone with write access
# approves them, so this check reports there one click late. Authenticating
# the release job as a GitHub App removes the click.
name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      # A push cannot change the title, so this looks redundant. It is not:
      # status checks are resolved per head SHA, so without a run on the new
      # commit `validate-title` reads as "expected" on the merge box against
      # the commit that will actually merge.
      - synchronize
      - ready_for_review

permissions:
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Listed visible-in-the-changelog first (feat..revert), then the
          # seven release-please recognizes but hides. Comments cannot go
          # inside this block: the action splits it on newlines and trims,
          # with no comment handling, so the whole comment line becomes a type
          # that matches nothing and is printed back to the contributor in the
          # "Available types" list on failure.
          types: |
            feat
            feature
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
          # A scope is optional and stays that way. This repository releases
          # one package in release-please's plain mode, so there is nothing a
          # scope could route to -- and release-please routes by the paths a
          # commit touches in any case, never by scope. release-please's own
          # `chore(master): release ...` title carries a scope, but only
          # incidentally.
          requireScope: false
