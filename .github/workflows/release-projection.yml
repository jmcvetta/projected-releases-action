# Run this action on its own pull requests.
#
# Dogfooding, and not only for the look of it: the two things that decide
# what a merge releases -- the Conventional Commit type in the title and the
# files the branch touches -- are exactly as invisible here as anywhere else,
# and this repository releases on every `feat:` and `fix:` that lands.
#
# `uses: ./` rather than a pinned version, so the projection a pull request
# shows is produced by that pull request's own code. A change that breaks the
# comment breaks its own comment, which is the most direct test this action
# has: the unit tests drive it against fixtures, and this drives it against a
# real repository and a real release-please.
#
# The step passes nothing, which is the whole configuration: this repository
# releases in release-please's manifest mode, so the action reads the same
# release-please-config.json and .release-please-manifest.json release-please
# will read (see release-please.yml). An input naming the mode here would be a
# second copy of that configuration, and a projection is only about the release
# the other one will cut.
name: Release Projection

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-projection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-projection:
    name: Release Projection
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            feature
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
          requireScope: false

      # Continue after a title failure so the projection remains visible. Skip
      # only release-please's own release pull requests.
      - uses: actions/checkout@v7
        if: ${{ !cancelled() && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        with:
          fetch-depth: 0

      # The bundle is committed, so there is nothing to install: `uses: ./`
      # runs dist/index.mjs straight out of the checkout. CI's staleness check
      # is what keeps that file equal to src/.
      #
      # No `with:` at all. `release-type` here would switch this projection
      # to plain mode and leave the two files unread, which is release-please
      # -action's rule copied faithfully -- and release-please.yml passes no
      # such input, so the projection would describe a configuration that will
      # never run. src/release-config.test.ts is what keeps the pair equal.
      - uses: ./
        if: ${{ !cancelled() && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
