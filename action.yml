# Say on a pull request which release-please tags merging it will cut.
#
# A bundled JavaScript action: `dist/index.mjs` is committed, so a caller pays
# no install step and the version they pin is the code that runs. Rebuild it
# with `npm run build`; CI fails a pull request whose bundle is stale.
name: Projected Releases for release-please
# Under 125 characters: GitHub Marketplace rejects a longer one.
description: >-
  Say which release-please tags merging a pull request will cut, from its
  Conventional Commit title and changed files.
author: Jason McVetta
branding:
  icon: tag
  color: purple

inputs:
  token:
    description: >-
      Token for release-please's reads and for the comment. `contents: read`
      and `pull-requests: write` are enough; the default GITHUB_TOKEN has both
      on a pull request from a branch of this repository.
    required: false
    default: ${{ github.token }}
  mode:
    description: >-
      `render-and-comment` (default) renders the projection and posts it as a
      sticky comment. `render` only writes the file and the outputs, for a
      job whose token cannot comment. `comment` posts a body an earlier job
      rendered, and projects nothing — the two halves of the fork-safe
      arrangement in `examples/`.
    required: false
    default: render-and-comment

  # Everything below defaults to the pull request in the webhook payload. They
  # are inputs because a `workflow_run` companion job has no payload to read.
  repository:
    description: The repository, as owner/name. Defaults to the running one.
    required: false
    default: ""
  number:
    description: The pull request number.
    required: false
    default: ""
  title:
    description: The pull request title, which squash-merge makes the commit subject.
    required: false
    default: ""
  body:
    description: The pull request description, which becomes the commit body.
    required: false
    default: ""
  base:
    description: The branch the pull request targets, by name.
    required: false
    default: ""
  head-sha:
    description: The commit the projection describes, stamped in the footer.
    required: false
    default: ""
  head-branch:
    description: The pull request head branch name.
    required: false
    default: ""

  changed-files:
    description: >-
      Where the changed-file list comes from. `auto` (default) diffs the
      checkout and falls back to the API when the checkout is too shallow to
      hold the merge base; `git` insists on the checkout; `api` skips it.
    required: false
    default: auto
  head:
    description: >-
      Local git ref of the pull request head. Defaults to `HEAD` for the
      changed-file diff, and to `head-sha` where the checkout holds it for the
      branch's commits under a merge or rebase projection: on a
      `pull_request` event `HEAD` is `refs/pull/N/merge`, whose diff is the
      pull request's but whose commit is not one merging writes. Set it to
      override both.
    required: false
    default: ""

  diff-base:
    description: >-
      Local git ref the checkout is read through: the changed-file diff runs
      against it, and the file list of each commit release-please walks is
      indexed from it. Defaults to `origin/<base>`; release-please wants a
      branch name, git wants a ref.
    required: false
    default: ""

  config-file:
    description: Path to release-please-config.json.
    required: false
    default: release-please-config.json
  manifest-file:
    description: Path to .release-please-manifest.json.
    required: false
    default: .release-please-manifest.json
  repo-root:
    description: >-
      Directory the two files above are read from, and the checkout
      `release-workflow` is looked for under.
    required: false
    default: "."
  release-workflow:
    description: >-
      Where the workflow calling `googleapis/release-please-action` is, so
      that the inputs below can be compared with the ones it passes -- two
      copies of one configuration, and a projection of tags that will not be
      cut when they drift apart. `auto` (default) scans `.github/workflows`
      in the checkout; a path names one workflow; `off` reads nothing.
      Checking only, never reading values in: anything that cannot be worked
      out for certain -- no such workflow, one that does not parse, two that
      could both be the releaser, a value the runner resolves rather than the
      file -- produces no note rather than a guess.
    required: false
    default: auto

  release-type:
    description: >-
      Set this for a repository release-please runs WITHOUT a manifest --
      `release-type:` on release-please-action, no release-please-config.json
      and no .release-please-manifest.json. One package, configured here
      rather than read from the checkout, so `config-file` and `manifest-file`
      are unused. (`repo-root` still is: the release strategy opens the
      package file to derive the component name.) Values are release-please's
      own release types (`node`, `python`, `simple`, ...). Leave empty for
      manifest mode.

      Its presence is the mode switch, exactly as on release-please-action,
      so it has to match what your release workflow passes: set here and not
      there, release-please reads the config files this projection ignored.
      Setting it with those files in the checkout is a warning on the
      comment, not an error.
    required: false
    default: ""
  package-path:
    description: >-
      Directory the single package covers, with `release-type`. Defaults to
      the repository root, which is what a single-package repository means.
    required: false
    default: ""
  component:
    description: >-
      Component name for the single package, with `release-type`. Usually
      unnecessary: the release type derives one (a `node` release takes the
      package.json name) and this action asks release-please for it.
      release-please-action exposes no input for this, so a repository whose
      releases it cuts cannot set one -- leave this empty unless something
      that can (release-please's own CLI) cuts them.
    required: false
    default: ""
  include-component-in-tag:
    description: >-
      Whether the single package's tags carry its component, with
      `release-type`. Defaults to false, so a single-package repository tags
      `v1.2.3` rather than `name-v1.2.3`.
    required: false
    default: ""
  tag-separator:
    description: >-
      What separates component from version in a tag, with `release-type`.
      Like `component`, release-please-action exposes no input for this.
    required: false
    default: ""
  versioning-strategy:
    description: >-
      How the version bumps, with `release-type`. Pass what your release
      workflow passes: left alone release-please bumps a minor for `feat:`
      and a patch for `fix:`, and `always-bump-patch` (say) releases a
      feature as a patch. One of release-please's own strategies
      (`default`, `always-bump-patch`, `prerelease`, ...).
    required: false
    default: ""
  release-as:
    description: >-
      A version to release, with `release-type`, forcing every release to it.
      Pass what your release workflow passes. This is the release-please
      -action input, which is sticky -- it holds until the line is removed,
      so a repository that has one releases that version and no other. The
      `Release-As:` trailer in a pull request body is the per-commit form,
      and this action reads that from the body already.
    required: false
    default: ""

  visible-types:
    description: >-
      Commit types that render a changelog line, and so can open a release,
      as a comma- or space-separated list. Overrides what is resolved from
      the config's `changelog-sections`, which is itself preferred to the
      conventionalcommits defaults.
    required: false
    default: ""
  hidden-types:
    description: >-
      Commit types the changelog recognizes but does not render. Same form
      and same precedence as `visible-types`.
    required: false
    default: ""
  release-branch-prefix:
    description: >-
      How release-please names its own release pull request branches. Only
      set this if the repository has changed it from `release-please--`.
    required: false
    default: ""

  merge-method:
    description: >-
      How this repository merges pull requests, which decides what the
      projection models. `auto` (default) reads the repository's settings:
      squash-merge wherever it is allowed, and the method the repository does
      allow otherwise. `squash` and `rebase` assert one without the read;
      `merge` asserts the method but still reads `merge_commit_title` and
      `merge_commit_message`, which decide what the merge commit says.

      Under `merge` and `rebase` the pull request title is not what
      release-please parses -- the branch's own commits are, plus the merge
      commit under `merge` -- so the title's type decides nothing and
      `malformed-title` is always false. Those commits are read from the
      checkout as `<diff-base>..<head>`, which needs `fetch-depth: 0`, and
      from the API otherwise at one request per commit for their files. A
      branch too long for that is left unmodelled and the comment says so.
    required: false
    default: auto
  link-release-prs:
    description: >-
      List the open pull requests, so a pending version can link to the
      release pull request holding it. Set false to skip the call.
    required: false
    default: "true"

  comment-header:
    description: >-
      Identifies the sticky comment. Change it only to keep two invocations
      on the same pull request from editing each other's comment.
    required: false
    default: projected-releases
  output-file:
    description: Where the rendered comment body is written.
    required: false
    default: projected-releases.md
  step-summary:
    description: Also write the projection to the job summary.
    required: false
    default: "true"

  api-url:
    description: REST API root. Defaults to the running server's.
    required: false
    default: ""
  graphql-url:
    description: >-
      GraphQL API root. Defaults to the running server's. Either form works --
      a trailing `/graphql` is stripped, because release-please hands this to
      Octokit as a base URL and Octokit appends `/graphql` itself.
    required: false
    default: ""
  run-url:
    description: This workflow run, linked from the comment's footer.
    required: false
    default: ""

outputs:
  comment-file:
    description: The file the comment body was written to.
  body:
    description: The rendered comment body.
  releases:
    description: >-
      The projected releases as JSON, one `{component, version, notes}` per
      tag merging would cut.
  releases-count:
    description: How many releases merging would cut. `0` is the common case.
  malformed-title:
    description: >-
      `true` when the projection was withheld because the title is not a
      Conventional Commit the changelog recognizes. Always `false` under
      `merge-method: merge` or `rebase`, where the title is not what
      release-please parses.
  recognized-types:
    description: >-
      The commit types this run resolved, comma-separated. Pin a PR-title
      gate to this rather than keeping a second copy of the list.

runs:
  # Node 20 was removed from Actions runners on 2026-09-16.
  using: node24
  main: dist/index.mjs
